[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "robust-lunarlander-rl"
version = "1.0.0"
description = "Reproducible DQN and DDQN study of stochastic actuator failures in LunarLander-v3"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Group 148" }]
dependencies = [
  "gymnasium[box2d]==1.2.3",
  "matplotlib==3.10.9",
  "numpy==2.4.4",
  "pandas==3.0.2",
  "seaborn==0.13.2",
  "torch==2.13.0",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.30,<7",
  "jupyter>=1.1,<2",
  "nbformat>=5.10,<6",
  "pytest==9.0.3",
  "ruff>=0.14,<0.15",
]

[project.scripts]
verify-lunarlander-wrapper = "robust_lunarlander.verification:main"
train-lunarlander-agents = "robust_lunarlander.experiment:main"

[tool.hatch.build.targets.wheel]
packages = ["src/robust_lunarlander"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
